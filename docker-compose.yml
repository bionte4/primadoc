services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: prismadoc
      POSTGRES_PASSWORD: prismadoc
      POSTGRES_DB: prismadoc
    ports:
      - "5434:5432"
    volumes:
      - prismadoc_pg:/var/lib/postgresql/data

volumes:
  prismadoc_pg:
